# Descriptions des applications (boutique / catalogue)

app.airsonic.description: "Serveur de streaming musical auto-hébergé, compatible Subsonic (fork Airsonic-Advanced)."
app.audiobookshelf.description: "Serveur de livres audio et podcasts auto-hébergé, avec applications et lecteur web."
app.autobrr.description: 'Autobrr est un remplacement binaire unique moderne pour le plugin autodl-irssi+rutorrent. Autobrr surveille les canaux d''annonces IRC et les flux RSS torznab pour obtenir les sorties dès qu''elles sont disponibles, avec un bon filtrage et une prise en charge des expressions régulières.''"'
app.autopulse.description: "Déclenche des scans de bibliothèque Plex/Jellyfin/Emby après les téléchargements (*arr)."
app.bazarr.description: "Bazarr est une application complémentaire de Sonarr et Radarr. Elle gère et télécharge les sous-titres en fonction de vos besoins. Vous définissez vos préférences par émission de télévision ou film et Bazarr s'occupe de tout pour vous."
app.bazarr4k.description: "Instance Bazarr dédiée aux profils 4K / UHD, séparée de votre Bazarr principal."
app.byparr.description: "Successeur communautaire de FlareSolverr basé sur Camoufox / Playwright (FastAPI). KRATE clone le dépôt Git, gère le venv via uv et expose l'API /v1 derrière systemd — sans Docker."
app.calibre.description: "Bibliothèque Calibre avec serveur de contenu (calibre-server) et interface Calibre-Web ; conversion ebook incluse."
app.checkrr.description: "Analyse les fichiers multimédias de la bibliothèque pour détecter la corruption ; peut les remplacer via Sonarr/Radarr."
app.cleanuparr.description: "Nettoie et maintient les files *arr et les clients de téléchargement pour éviter les blocages."
app.cross-seed.description: "Cherche et ajoute des cross-seeds pour maximiser le ratio sur vos torrents existants."
app.decluttarr.description: "Worker en arrière-plan (sans interface web) : nettoie les files d'attente *arr et les clients de téléchargement."
app.deluge.description: "Client BitTorrent Deluge (deluged + Deluge-Web). Branche main ou develop."
app.dispatcharr.description: "Gestion IPTV et EPG auto-hébergée avec proxy pour Plex, Jellyfin et Emby."
app.duplicati.description: "Sauvegardes chiffrées vers le cloud ou un stockage distant, avec planification et restauration."
app.emby.description: "Emby Server est un progiciel client-serveur qui permet aux consommateurs d'héberger leurs copies personnelles légales de fichiers multimédias : fichiers musicaux, vidéo et image. ... Le logiciel client Emby est une application que vous devez installer sur les appareils mobiles et certains décodeurs pour téléviseurs, comme Android TV."
app.episeerr.description: "Envoie et retire les épisodes/saisons Sonarr un par un selon les règles de profondeur de bibliothèque."
app.fetcharr.description: "Synchronise les enregistrements PVR Fetch TV vers Plex."
app.filebrowser.description: "File Browser est un gestionnaire de fichiers léger qui vous permet de télécharger et de gérer des fichiers à partir de votre navigateur Web. Il permet la création de plusieurs utilisateurs et chaque utilisateur peut avoir son propre répertoire. Il peut être utilisé comme une application autonome ou comme un middleware."
app.flaresolverr.description: "FlareSolverr est un serveur proxy qui résout les défis Cloudflare, reCAPTCHA, hCaptcha et FunCaptcha. Jackett et les apps *arr s’en servent souvent. Sous Krate : binaire Linux officiel, systemd, Chromium/Xvfb via APT — pas Docker."
app.flexget.description: "Automatisation polyvalente de téléchargements (RSS, torrents, etc.) via des recettes YAML."
app.flood.description: "Flood est une interface Web moderne pour rTorrent avec un backend Node.js et un frontend React. Il prend en charge l'intégration complète avec rTorrent et ruTorrent, y compris la gestion des répertoires de surveillance, l'ajout de torrents, etc."
app.headphones.description: "Gestionnaire de collection musicale pour Usenet et BitTorrent (style *arr pour la musique)."
app.jackett.description: "Jackett fonctionne comme un serveur proxy : il traduit les requêtes des applications (Sonarr, Radarr, SickRage, CouchPotato, Mylar, etc.) en requêtes http spécifiques au site de suivi, analyse la réponse HTML, puis renvoie les résultats au logiciel demandeur."
app.janitorr.description: "Nettoie Radarr, Sonarr, Jellyseerr et Jellyfin avant que vous ne manquiez d'espace disque."
app.jdownloader.description: "Gestionnaire de téléchargements multi-hôtes (JDownloader 2) avec interface web MyJDownloader."
app.jellyfin.description: "Jellyfin est un serveur multimédia libre et open source pour vos films, séries, musique et photos. Diffusez sur tous vos appareils depuis votre bibliothèque, sans abonnement."
app.kapowarr.description: "Constructeur et gestionnaire de bibliothèque de bandes dessinées."
app.kavita.description: "Lecteur et serveur de bandes dessinées, mangas et livres numériques, orienté bibliothèque."
app.kometa.description: "Métadonnées, collections et playlists pour Plex/Jellyfin/Emby."
app.komga.description: "Serveur de médiathèque pour comics et mangas, avec API et lecteur web."
app.labelarr.description: "Ajoute les mots-clés TMDB comme labels/genres Plex."
app.lidarr.description: "Lidarr est un gestionnaire de collection de musique pour les utilisateurs Usenet et BitTorrent. Il peut surveiller plusieurs flux RSS pour les nouveaux morceaux de vos artistes préférés et les récupérera, les triera et les renommera."
app.lingarr.description: "Traduction automatique de sous-titres pour Radarr et Sonarr."
app.listenarr.description: "Gestion automatisée de collection de livres audio (approche Sonarr pour les audiobooks)."
app.magazarr.description: "Suivi et téléchargement automatisé de magazines numériques."
app.maintainerr.description: "Maintenance de bibliothèque pour Plex et Jellyfin."
app.medusa.description: "PVR pour séries TV via Usenet et BitTorrent (fork SickRage / SickBeard)."
app.midarr.description: "Serveur multimédia minimaliste et léger."
app.muxarr.description: "Supprime les pistes audio/sous-titres redondantes avec intégration *arr."
app.mylar3.description: "Gestionnaire de collection de comics pour Usenet et BitTorrent."
app.navidrome.description: "Serveur de streaming musical compatible Subsonic, léger et moderne."
app.nextcloud.description: "Suite de collaboration auto-hébergée (fichiers, agenda, contacts, etc.)."
app.notifiarr.description: 'Il s''agit du client unifié pour <a href="https://nullrefer.ir/?https://notifiarr.com/"rel="noopener nofollow"target="_blank">Notifiarr.com</a>. Le client permet les demandes de contenu de Media Bot sur votre serveur Discord et fournit également des rapports sur l''utilisation de Plex et la santé du système parmi de nombreuses autres fonctionnalités..'
app.novnc.description: "Bureau distant HTML5 (noVNC) pour accéder à une session graphique depuis le navigateur."
app.nzbget.description: "NZBGet est un récupérateur de nouvelles binaires qui télécharge des fichiers depuis Usenet en fonction des informations fournies dans les fichiers nzb. NZBGet est écrit en C++ et est connu pour ses performances et son efficacité extraordinaires."
app.nzbhydra2.description: "Méta-recherche Usenet : agrège les indexeurs et expose une API compatible *arr."
app.ombi.description: "Ombi est une application Web auto-hébergée qui donne automatiquement à vos utilisateurs Plex ou Emby partagés la possibilité de demander eux-mêmes du contenu !"
app.plex.description: "Plex est un système de lecteur multimédia client-serveur et une suite logicielle comprenant deux composants principaux. L'application de bureau Plex Media Server fonctionne sur les systèmes compatibles Windows, macOS et Linux, y compris certains types d'appareils NAS. L'application de bureau du serveur organise la vidéo, l'audio et les photos des collections d'un utilisateur et des services en ligne, permettant aux lecteurs d'accéder au contenu et de le diffuser en continu."
app.posterr.description: "Affichage d'affiches numériques pour Plex, Sonarr et Radarr."
app.prefetcharr.description: "Précharge la saison Sonarr suivante pendant que vous regardez sur Jellyfin."
app.prowlarr.description: "Prowlarr est un fork de Sonarr qui fonctionne avec l'API Jackett. Il vous permet d'agréger tous vos indexeurs favoris et de rechercher facilement du contenu."
app.pyload.description: "Gestionnaire de téléchargements libre avec interface web moderne (pyload-ng)."
app.qbittorrent.description: "Binaire qBittorrent-nox à /{user}'/qbittorrent via Caddy."
app.quasarr.description: "Connecte JDownloader à Radarr, Sonarr, Lidarr et LazyLibrarian."
app.quassel.description: "Client IRC moderne avec cœur (core) persistant et interfaces graphiques."
app.radarr.description: "Radarr est un fork indépendant de Sonarr retravaillé pour télécharger automatiquement des films via Usenet et BitTorrent.<br>Le projet a été inspiré par d'autres téléchargeurs de films Usenet/BitTorrent tels que CouchPotato."
app.radarr4k.description: "Radarr4K est un clone autonome de Radarr pour les profils 4K UHD. Il s'agit d'un moyen de gérer plusieurs instances de Radarr, tout en séparant le contenu UHD du contenu général."
app.rclone.description: "Stockage cloud avec OAuth/SA, montages FUSE, mergerfs media/vues, crypt, et move planifié cache→remote."
app.recyclarr.description: "Synchronise les guides TRaSH vers Sonarr et Radarr."
app.reiverr.description: "Interface combinée pour Jellyfin, TMDB, Radarr et Sonarr."
app.requestrr.description: "Application Requestrr."
app.resilio-sync.description: "Synchronisation de fichiers peer-to-peer (Resilio Sync) entre appareils."
app.rtorrent.description: "rTorrent est un client BitTorrent rapide et efficace qui utilise, et est en cours de développement parallèlement à, la bibliothèque libTorrent (à ne pas confondre avec libtorrent-rasterbar). Il est écrit en C++ et utilise la bibliothèque de programmation ncurses, ce qui signifie qu'il utilise une interface utilisateur texte."
app.rutorrent.description: "Interface web pour rTorrent (PHP). Nécessite rtorrent@<user> au préalable."
app.sabnzbd.description: "SABnzbd est un lecteur de news binaire open source écrit en Python. Il simplifie considérablement le processus de téléchargement depuis Usenet, grâce à son interface utilisateur Web conviviale et à ses fonctionnalités d'automatisation avancées."
app.scraparr.description: "Métriques Prometheus depuis les apps *arr et associées."
app.seerr.description: "Demandes et découverte de médias pour Jellyfin, Plex et Emby."
app.shelfmark.description: "Gestion et suivi de lecture pour livres et bibliothèques personnelles."
app.sickchill.description: "PVR pour séries TV (fork SickRage) via Usenet et BitTorrent."
app.sickgear.description: "PVR pour séries TV, fork stable de SickBeard / SickRage."
app.sonarr.description: "Sonarr est un PVR pour les utilisateurs Usenet et BitTorrent. Il peut surveiller plusieurs flux RSS pour les nouveaux épisodes de vos émissions préférées et les récupérera, les triera et les renommera. Il peut également être configuré pour mettre à niveau automatiquement la qualité des fichiers déjà téléchargés lorsqu'un format de meilleure qualité devient disponible."
app.sonarr-naacky.description: "Fork de Sonarr v4 develop orienté anime pour les médias CJK."
app.sonarr4k.description: "Sonarr4K est un clone autonome de Sonarr pour les profils 4K UHD. Il s'agit d'un moyen de gérer plusieurs instances de Sonarr, tout en séparant le contenu UHD du contenu général."
app.sportarr.description: "PVR sportif pour Usenet et torrents — comme Sonarr/Radarr, pour les événements sportifs."
app.stremio.description: "Serveur de streaming Stremio (server.js) pour clients distants — transcodage ffmpeg en loopback derrière Caddy."
app.subsonic.description: "Serveur de streaming musical et média avec API Subsonic et clients tiers."
app.suggestarr.description: "Recommandations et demandes de téléchargement à partir de l'activité du serveur multimédia."
app.syncthing.description: "Synchronisation de fichiers continue, décentralisée et chiffrée entre appareils."
app.tautulli.description: "Tautulli est une application tierce que vous pouvez exécuter avec votre serveur multimédia Plex pour surveiller l'activité et suivre diverses statistiques."
app.tdarr.description: "Automatisation de transcodage distribuée avec FFmpeg/HandBrake."
app.thelounge.description: "Client IRC web persistant, accessible depuis le navigateur."
app.threadfin.description: "Proxy IPTV / xTeVe-like pour exposer des chaînes aux clients Plex/Jellyfin/Emby."
app.tracearr.description: "Surveillance et analytique des flux pour Plex, Jellyfin et Emby."
app.trailarr.description: "Télécharge et gère les bandes-annonces pour les bibliothèques Radarr et Sonarr."
app.transmission.description: "Démon Transmission à /{user}'/transmission via Caddy."
app.tunarr.description: "Génération de chaînes IPTV à partir de bibliothèques Plex/Jellyfin/Emby."
app.unmanic.description: "Optimisation et conversion automatique de bibliothèques média (plugins, files d'attente)."
app.unpackerr.description: "Unpackerr est un remplacement moderne du plugin Unpack pour rTorrent. Il surveille votre répertoire de téléchargement pour les nouveaux torrents et les extrait automatiquement."
app.whisparr.description: "Whisparr est un fork indépendant de Radarr retravaillé pour télécharger automatiquement des films pour adultes via Usenet et BitTorrent."
app.whisparr-eros.description: "Application Whisparr-Eros."
app.wizarr.description: "Système d'invitation utilisateur pour Plex, Jellyfin, Emby et applications associées."
app.x2go.description: "Bureau distant Linux (X2Go) pour sessions graphiques persistantes."
app.ytdl-sub.description: "Automatise les téléchargements yt-dlp et les métadonnées pour les médiathèques (CLI, sans UI web)."
app.znc.description: "Bouncer IRC avancé pour rester connecté et historiser les salons."
